- insert:
    - id: prismflow-core
      name: '@prismflow/dsh/core'

    - id: prismflow-publisher-core
      name: '@prismflow/dsh/publisher-core'

    - id: prismflow-publisher-local-markdown
      name: '@prismflow/dsh/publisher-local-markdown'
      disabled: true
      config:
        destinations: []

    - id: prismflow-publisher-github-markdown
      name: '@prismflow/dsh/publisher-github-markdown'
      disabled: true
      config:
        destinations: []

    - id: prismflow-publisher-r2-markdown
      name: '@prismflow/dsh/publisher-r2-markdown'
      disabled: true
      config:
        destinations: []

    - id: prismflow-publisher-wechat-draft
      name: '@prismflow/dsh/publisher-wechat-draft'
      disabled: true
      config:
        destinations: []

    - id: prismflow-source-rss
      name: '@prismflow/dsh/source-rss'
      config:
        feeds: []

    - id: prismflow-source-github-trending
      name: '@prismflow/dsh/source-github-trending'
      config:
        sources:
          - id: default
            name: GitHub Trending
            baseUrl: https://github.com/trending
            category: githubTrending
            since: daily
            spokenLanguageCode: ''
            limit: 25

    - id: prismflow-source-follow
      name: '@prismflow/dsh/source-follow'
      config:
        sources: []

    - id: prismflow-source-ai-search
      name: '@prismflow/dsh/source-ai-search'
      config:
        sources: []

    - id: prismflow-store-source-settings
      name: '@prismflow/dsh/store-source-settings'
      disabled: true
      config:
        credentialSlots: []
        bootstrap: []

    - id: prismflow-store-content
      name: '@prismflow/dsh/store-content'
      disabled: true

    - id: prismflow-store-content-relevance
      name: '@prismflow/dsh/store-content-relevance'
      disabled: true
      config:
        defaultHours: 48
        maxHashCharsPerRecord: 2000000
        maxAggregateHashChars: 1500000000
        maxScanCharsPerRecord: 524288
        maxAggregateScanChars: 1500000000
        maxEvidence: 8
        maxEvidenceChars: 160
        maxCardChars: 2000

    - id: prismflow-store-publication-receipts
      name: '@prismflow/dsh/store-publication-receipts'
      disabled: true

    - id: prismflow-store-production-media
      name: '@prismflow/dsh/store-production-media'
      disabled: true
      config:
        maxAssetBytes: 10485760
        maxAssets: 10000
        defaultAssets: []

    - id: prismflow-store-rss-outputs
      name: '@prismflow/dsh/store-rss-outputs'
      disabled: true
      config:
        maxOutputs: 1000
        maxXmlBytes: 2097152

    - id: prismflow-store-production
      name: '@prismflow/dsh/store-production'
      disabled: true
      config:
        # Deployment-only absolute local path. Must differ from the workflow lock path.
        # Production initialization and every mutation fail closed while this is empty.
        writerLockPath: ''

    - id: prismflow-store-toolsets
      name: '@prismflow/dsh/store-prismflow-toolsets'
      disabled: true
      config:
        writerLockPath: ''
        skillRoot: ''
        pluginRoot: ''

    - id: prismflow-store-image-generation-settings
      name: '@prismflow/dsh/store-image-generation-settings'
      disabled: true
      config:
        apiKeyCredential: OPENAI_IMAGE_API_KEY
        allowDashboardCredentialWrite: true
        imageApiUrl: https://api.openai.com/v1/images/generations
        imageApiProtocol: auto
        imageModel: gpt-image-1
        imageSize: 1024x1024
        avifQuality: 70
        avifEffort: 5
        ffmpegPath: ''

    - id: prismflow-skill-provider
      name: '@prismflow/dsh/prismflow-skill-provider'
      disabled: true
      config:
        skillRoot: ''

    - id: prismflow-tool-production-media
      name: '@prismflow/dsh/tool-production-media'
      disabled: true

    - id: prismflow-store-content-selection
      name: '@prismflow/dsh/store-content-selection'
      disabled: true
      config:
        defaultMaxItems: 30
        maxItems: 50
        defaultMaxInputTokens: 50000
        maxInputTokens: 60000
        maxMaterialChars: 80000
        minCharsPerItem: 600
        maxCharsPerItem: 3000
        maxMediaPerItem: 2
        maxPerSource: 8
        sourceQuotaId: github-trending:daily
        sourceQuotaMinItems: 3
        sourceQuotaMaxItems: 5
        longTailPercent: 20
        maxBucketSize: 200
        maxPairComparisons: 200000
        maxMemberClaims: 10000
        selectionHashMaxChars: 12000000

    - id: prismflow-reviewer-ai-relevance-subagent
      name: '@prismflow/dsh/reviewer-ai-relevance-subagent'
      disabled: true
      config:
        subagentProvider: spawn
        batchSize: 50
        maxCards: 1000
        maxCardChars: 6000
        maxClusterInputChars: 500000
        minimumAiScore: 70

    - id: prismflow-store-generator-prompts
      name: '@prismflow/dsh/store-generator-prompts'
      disabled: true
      config:
        maxHistoryPerGenerator: 50

    - id: prismflow-store-generator-workflows
      name: '@prismflow/dsh/store-generator-workflows'
      disabled: true
      config:
        maxHistoryPerGenerator: 50
        # Deployment-only absolute local path, e.g. /var/lib/dsh/locks/prismflow-workflows.lock.
        # Must differ from the production lock path. Dashboard builder writes fail closed while empty.
        writerLockPath: ''

    - id: prismflow-generator-subagent
      name: '@prismflow/dsh/generator-subagent'
      disabled: true
      config:
        # New builder definitions are pinned to serial-workflow-v2. An exact-empty
        # per-step Process Prompt uses its deterministic deployment-owned fallback.
        builderProfile:
          id: dashboard-builder
          version: 1
          subagentProvider: spawn
          # `*` leaves the workflow agent unrestricted so every tool visible in
          # its DSH scope is available. Use [] only for a text-only deployment.
          allowedTools:
            - '*'
          maxSteps: 8
          maxInputChars: 100000
          maxIntermediateOutputChars: 100000
          maxCombinedInputChars: 250000
          maxOutputChars: 100000
          maxPromptAggregateChars: 32000
        generators: []

    - id: prismflow-tool-source
      name: '@prismflow/dsh/tool-source'

    - id: prismflow-tool-content
      name: '@prismflow/dsh/tool-content'
      disabled: true

    - id: prismflow-tool-content-relevance
      name: '@prismflow/dsh/tool-content-relevance'
      disabled: true

    - id: prismflow-tool-content-selection
      name: '@prismflow/dsh/tool-content-selection'
      disabled: true

    - id: prismflow-tool-publication-receipts
      name: '@prismflow/dsh/tool-publication-receipts'
      disabled: true

    - id: prismflow-tool-production
      name: '@prismflow/dsh/tool-production'
      disabled: true

    - id: prismflow-tool-legacy-production
      name: '@prismflow/dsh/tool-legacy-production'
      disabled: true
      config:
        imageApiKeyCredential: OPENAI_IMAGE_API_KEY
        imageApiUrl: https://api.openai.com/v1/images/generations
        imageApiProtocol: auto
        imageModel: gpt-image-1
        imageSize: 1024x1024
        avifQuality: 70
        avifEffort: 5
        ffmpegPath: ''
        videoCrf: 28
        videoPreset: slow
        maxVideoBytes: 26214400
        githubCredential: PRISMFLOW_GITHUB_TOKEN
        githubAllowArbitraryTargets: false
        workflowOwner: justlovemaki
        workflowRepository: Hex2077-Site
        workflowId: sync-notes.yml
        workflowRef: main
        r2PublisherId: ''
        rssSiteUrl: https://hex2077.dev/docs/
        rssFeedUrl: https://justlovemaki.github.io/CloudFlare-AI-Insight-Daily/rss.xml
        rssMaxItems: 7
